name: Validate Notifications and Components

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gct_system_test
          MYSQL_USER: gct
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          printf '\nDB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=gct_system_test\nDB_USERNAME=gct\nDB_PASSWORD=secret\n' >> .env

      - name: Validate fresh migrations
        run: php artisan migrate:fresh --force

      - name: Compile all Blade views
        run: php artisan view:cache

      - name: Validate routes
        run: php artisan route:list

      - name: Build frontend assets
        run: npm run build

      - name: Run automated tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: gct_system_test
          DB_USERNAME: gct
          DB_PASSWORD: secret
        run: php artisan test
