name: Consolidate Page Assets

on:
  push:
    paths:
      - '.github/workflows/consolidate-page-assets.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Consolidate page-specific assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import glob
          import re

          root = Path('.')

          def read(path):
              p = root / path
              return p.read_text(encoding='utf-8') if p.exists() else ''

          def write(path, content):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.rstrip() + '\n', encoding='utf-8')

          def strip_imports(content):
              return re.sub(
                  r'^\s*import\s+.*?;\s*$',
                  '',
                  content,
                  flags=re.MULTILINE,
              ).strip()

          def merge(target, sources, label, strip_js_imports=False):
              target_path = root / target
              if not target_path.exists():
                  print(f'SKIP missing target: {target}')
                  return []

              content = read(target)
              merged = []

              for source in sources:
                  source_path = root / source
                  if not source_path.exists():
                      continue

                  marker = f'CONSOLIDATED: {source}'
                  if marker not in content:
                      source_content = read(source)
                      if strip_js_imports:
                          source_content = strip_imports(source_content)

                      content += (
                          f'\n\n/* =========================================================\n'
                          f'   {marker}\n'
                          f'========================================================= */\n'
                          f'{source_content.strip()}\n'
                      )

                  merged.append(source)

              write(target, content)
              return merged

          deleted = []

          # ---------------------------------------------------------
          # Fuel Reports: keep only fuel-reports.css and fuel-reports.js
          # ---------------------------------------------------------
          fuel_css_sources = [
              'resources/css/Maintenance/fuel-report-modal-refinement.css',
              'resources/css/Maintenance/fuel-reports-line-enhancements.css',
          ]
          deleted += merge(
              'resources/css/Maintenance/fuel-reports.css',
              fuel_css_sources,
              'Fuel Reports consolidated styles',
          )

          fuel_js_target = 'resources/js/Maintenance/fuel-reports.js'
          fuel_js = read(fuel_js_target)

          # Remove the original chart initializer before adding the newer
          # scalable line-chart implementation. This prevents two scripts
          # from owning the same canvas elements.
          chart_start = fuel_js.find(
              '  /* =========================================================\n     CHARTS'
          )
          events_start = fuel_js.find(
              '  /* =========================================================\n     EVENTS'
          )
          if chart_start != -1 and events_start != -1 and events_start > chart_start:
              fuel_js = fuel_js[:chart_start] + fuel_js[events_start:]

          fuel_js = fuel_js.replace('\n  initializeFuelCharts();\n', '\n')
          write(fuel_js_target, fuel_js)

          fuel_js_sources = [
              'resources/js/Maintenance/fuel-report-chart-refinement.js',
              'resources/js/Maintenance/fuel-reports-line-enhancements.js',
          ]
          deleted += merge(
              fuel_js_target,
              fuel_js_sources,
              'Fuel Reports consolidated scripts',
              strip_js_imports=True,
          )

          # ---------------------------------------------------------
          # Job Orders: keep only job-order.css and job-order.js
          # ---------------------------------------------------------
          job_css_sources = [
              'resources/css/Maintenance/job-order-redesign.css',
              'resources/css/Maintenance/job-order-edit-combobox.css',
          ]
          deleted += merge(
              'resources/css/Maintenance/job-order.css',
              job_css_sources,
              'Job Orders consolidated styles',
          )

          job_js_sources = [
              'resources/js/Maintenance/job-order-finish-guard.js',
              'resources/js/Maintenance/job-order-edit-combobox.js',
              'resources/js/Maintenance/job-order-new-combobox.js',
          ]
          deleted += merge(
              'resources/js/Maintenance/job-order.js',
              job_js_sources,
              'Job Orders consolidated scripts',
              strip_js_imports=True,
          )

          # ---------------------------------------------------------
          # PMS Scheduling
          # ---------------------------------------------------------
          deleted += merge(
              'resources/css/Maintenance/pms-scheduling.css',
              ['resources/css/Maintenance/pms-table-scroll.css'],
              'PMS Scheduling consolidated styles',
          )

          # ---------------------------------------------------------
          # Operation Auto Scheduling / conflict UI
          # Dynamically locate the existing auto-scheduling base files.
          # ---------------------------------------------------------
          auto_css_sources = [
              'resources/css/Operation/Scheduling_And_Dispatch/auto-conflict-redesign.css',
              'resources/css/Operation/Scheduling_And_Dispatch/auto-conflict-readable.css',
          ]
          auto_js_sources = [
              'resources/js/Operation/Scheduling_And_Dispatch/auto-conflict-redesign.js',
          ]

          css_candidates = [
              p for p in glob.glob(
                  'resources/css/Operation/Scheduling_And_Dispatch/*.css'
              )
              if p not in auto_css_sources
              and ('auto' in Path(p).name.lower() or 'schedul' in Path(p).name.lower())
          ]
          js_candidates = [
              p for p in glob.glob(
                  'resources/js/Operation/Scheduling_And_Dispatch/*.js'
              )
              if p not in auto_js_sources
              and ('auto' in Path(p).name.lower() or 'schedul' in Path(p).name.lower())
          ]

          if css_candidates:
              deleted += merge(
                  sorted(css_candidates)[0],
                  auto_css_sources,
                  'Auto Scheduling consolidated styles',
              )
          else:
              print('SKIP: no Auto Scheduling CSS target found')

          if js_candidates:
              deleted += merge(
                  sorted(js_candidates)[0],
                  auto_js_sources,
                  'Auto Scheduling consolidated scripts',
                  strip_js_imports=True,
              )
          else:
              print('SKIP: no Auto Scheduling JS target found')

          # ---------------------------------------------------------
          # Attendance: consolidate into the existing batch-attendance files.
          # These are already the shared attendance entry points.
          # ---------------------------------------------------------
          attendance_css_sources = [
              'resources/css/Operation/Attendance/batch-attendance-scroll-fix.css',
              'resources/css/Operation/Attendance/batch-attendance-availability.css',
              'resources/css/Operation/Attendance/personnel-attendance-refactor.css',
              'resources/css/Operation/Attendance/personnel-master-bus-alignment.css',
          ]
          deleted += merge(
              'resources/css/Operation/Attendance/batch-attendance.css',
              attendance_css_sources,
              'Attendance consolidated styles',
          )

          attendance_js_sources = [
              'resources/js/Operation/Attendance/batch-attendance-availability.js',
              'resources/js/Operation/Attendance/personnel-attendance-refactor.js',
          ]
          deleted += merge(
              'resources/js/Operation/Attendance/batch-attendance.js',
              attendance_js_sources,
              'Attendance consolidated scripts',
              strip_js_imports=True,
          )

          # ---------------------------------------------------------
          # Remove obsolete source files after successful merge.
          # ---------------------------------------------------------
          for source in sorted(set(deleted)):
              p = root / source
              if p.exists():
                  p.unlink()
                  print(f'DELETED {source}')

          # ---------------------------------------------------------
          # Clean app.js. Keep only genuinely shared global assets and the
          # consolidated attendance entry points (currently shared by both
          # attendance pages). Page-specific Fuel, JO, PMS and Auto assets
          # are loaded through their existing Blade page asset lists.
          # ---------------------------------------------------------
          app_path = 'resources/js/app.js'
          app = read(app_path)

          obsolete_import_paths = set(deleted) | {
              'resources/css/Maintenance/job-order-redesign.css',
              'resources/css/Maintenance/job-order-edit-combobox.css',
              'resources/js/Maintenance/job-order-finish-guard.js',
              'resources/js/Maintenance/job-order-edit-combobox.js',
              'resources/js/Maintenance/job-order-new-combobox.js',
              'resources/css/Maintenance/pms-table-scroll.css',
              'resources/css/Operation/Scheduling_And_Dispatch/auto-conflict-redesign.css',
              'resources/css/Operation/Scheduling_And_Dispatch/auto-conflict-readable.css',
              'resources/js/Operation/Scheduling_And_Dispatch/auto-conflict-redesign.js',
          }

          cleaned_lines = []
          for line in app.splitlines():
              normalized = line.replace("'", '').replace('"', '')
              if any(path in normalized for path in obsolete_import_paths):
                  continue

              if line.strip().startswith('/* Job Orders shared refinements'):
                  continue
              if line.strip().startswith('/* PMS Scheduling table scroll'):
                  continue
              if line.strip().startswith('/* Operation enhancements'):
                  continue

              cleaned_lines.append(line)

          # Collapse excessive blank lines.
          app = '\n'.join(cleaned_lines)
          app = re.sub(r'\n{3,}', '\n\n', app).strip() + '\n'
          write(app_path, app)

          # Remove this one-time workflow from the final repository state.
          workflow = root / '.github/workflows/consolidate-page-assets.yml'
          if workflow.exists():
              workflow.unlink()

          print('Asset consolidation completed.')
          PY

      - name: Commit consolidated assets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No consolidation changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate page-specific frontend assets"
          git push origin HEAD:main
