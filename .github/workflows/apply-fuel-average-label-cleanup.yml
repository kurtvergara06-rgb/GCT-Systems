name: Apply Fuel Average Label Cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-fuel-average-label-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clean Fuel average chart label
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          js_path = Path('resources/js/Maintenance/fuel-reports.js')
          js = js_path.read_text(encoding='utf-8')
          old = """    ctx.setLineDash([]);\n    ctx.fillStyle = '#8a5b00';\n    ctx.font = '600 10px Poppins';\n    ctx.textAlign = x > area.right - 90 ? 'right' : 'left';\n    ctx.fillText(`Fleet avg ${average.toFixed(2)}`, x + (x > area.right - 90 ? -6 : 6), area.top + 12);\n    ctx.restore();"""
          new = """    ctx.setLineDash([]);\n    ctx.restore();"""
          if old not in js:
              raise SystemExit('Expected Fleet Average canvas label block not found.')
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          blade_path = Path('resources/views/Maintenance/fuel-reports.blade.php')
          blade = blade_path.read_text(encoding='utf-8')
          old_desc = 'description="Top 10 vehicles ranked by fuel efficiency. Fleet average is shown as a reference."'
          new_desc = 'description="Top 10 vehicles ranked by fuel efficiency. Fleet Average: {{ number_format($fleetAverage, 2) }} km/L."'
          if old_desc in blade:
              blade = blade.replace(old_desc, new_desc, 1)
          else:
              old_desc = 'description="10 lowest-efficiency buses that need attention. Fleet average is shown as a reference."'
              new_desc = 'description="10 lowest-efficiency buses that need attention. Fleet Average: {{ number_format($fleetAverage, 2) }} km/L."'
              if old_desc not in blade:
                  raise SystemExit('Expected Fuel Efficiency chart description not found.')
              blade = blade.replace(old_desc, new_desc, 1)
          blade_path.write_text(blade, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-fuel-average-label-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clean up Fuel fleet average chart label"
          git push origin HEAD:main
