name: Theme System Toast

on:
  push:
    paths:
      - '.github/workflows/theme-system-toast.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update Fuel feedback and system toast theme
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          blade = Path('resources/views/Maintenance/fuel-reports.blade.php')
          text = blade.read_text(encoding='utf-8')
          pattern = re.compile(r"\n\s*@if\(session\('success'\)\)\s*\n\s*<div class=\"fuel-alert success\">.*?</div>\s*\n\s*@endif\s*\n", re.S)
          text, count = pattern.subn('\n', text, count=1)
          if count == 0:
              print('Fuel success banner already removed or markup changed.')
          blade.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/theme-system-toast.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove duplicate Fuel success banner"
          git push origin HEAD:main

# retrigger
