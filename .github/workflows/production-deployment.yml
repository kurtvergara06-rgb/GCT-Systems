name: Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Pre-deployment quality gate
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python engine
        run: python -m compileall -q python_engine

  production:
    name: Production verification
    needs: quality
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://gct-systems.onrender.com/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for Render deployment
        run: sleep 120

      - name: Verify production site
        run: |
          curl --fail --retry 5 --retry-delay 15 \
          https://gct-systems.onrender.com/
