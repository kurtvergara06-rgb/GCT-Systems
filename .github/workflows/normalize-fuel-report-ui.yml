name: Normalize Fuel Reports UI

on:
  push:
    paths:
      - '.github/workflows/normalize-fuel-report-ui.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize Fuel Reports styling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          css_path = Path('resources/css/Maintenance/fuel-reports.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'FUEL REPORTS VISUAL CONSISTENCY'

          if marker not in css:
              css += r'''

/* =========================================================
   FUEL REPORTS VISUAL CONSISTENCY
   Keep cards, icons, typography and statuses uniform.
========================================================= */

.fuel-page,
.fuel-page button,
.fuel-page input,
.fuel-page select,
.fuel-page textarea,
.fuel-page table,
.fuel-page .badge,
.fuel-page .stat-card,
.fuel-page .fuel-chart-card,
.fuel-page .fuel-insight-card {
  font-family: "Poppins", sans-serif;
}

/* Summary cards */
.fuel-page .fuel-stats-grid .stat-card {
  min-height: 118px;
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  padding: 18px;
  border: 1px solid var(--fuel-border);
  border-radius: 16px;
  background: var(--fuel-white);
  box-shadow: 0 6px 18px rgba(6, 31, 61, 0.045);
}

.fuel-page .fuel-stats-grid .stat-icon,
.fuel-page .fuel-chart-icon,
.fuel-page .fuel-insight-icon {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  font-size: 17px;
  line-height: 1;
}

.fuel-page .fuel-stats-grid .stat-icon i,
.fuel-page .fuel-chart-icon i,
.fuel-page .fuel-insight-icon i {
  width: 18px;
  text-align: center;
  font-size: 17px;
  line-height: 1;
}

.fuel-page .fuel-stats-grid .stat-card-content {
  min-width: 0;
}

.fuel-page .fuel-stats-grid .stat-card-content p {
  margin: 0 0 5px;
  color: var(--fuel-muted);
  font-size: 11px;
  line-height: 1.35;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
}

.fuel-page .fuel-stats-grid .stat-card-content h2 {
  margin: 0;
  color: var(--fuel-navy);
  font-size: 21px;
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.fuel-page .fuel-stats-grid .stat-card-content small {
  display: block;
  margin-top: 5px;
  color: var(--fuel-muted);
  font-size: 10px;
  line-height: 1.4;
  font-weight: 500;
}

/* Shared icon color treatments */
.fuel-page .stat-icon.blue,
.fuel-page .fuel-chart-icon.blue,
.fuel-page .fuel-insight-icon.average {
  border: 1px solid #bfdbfe;
  background: #eff6ff;
  color: #0b40b5;
}

.fuel-page .stat-icon.green,
.fuel-page .fuel-insight-icon.efficient {
  border: 1px solid #bbf7d0;
  background: #f0fdf4;
  color: #15803d;
}

.fuel-page .stat-icon.yellow,
.fuel-page .fuel-chart-icon.yellow {
  border: 1px solid #fde68a;
  background: #fffbeb;
  color: #b77900;
}

.fuel-page .stat-icon.red,
.fuel-page .fuel-insight-icon.inefficient {
  border: 1px solid #fecaca;
  background: #fff1f2;
  color: #dc2626;
}

/* Chart and insight card typography */
.fuel-page .fuel-chart-header h2,
.fuel-page .fuel-insight-card h3,
.fuel-page .fuel-insight-label,
.fuel-page .fuel-insight-value {
  font-family: "Poppins", sans-serif;
}

.fuel-page .fuel-chart-header h2,
.fuel-page .fuel-insight-value {
  color: var(--fuel-navy);
  font-weight: 800;
}

.fuel-page .fuel-chart-heading p,
.fuel-page .fuel-insight-label,
.fuel-page .fuel-insight-description {
  color: var(--fuel-muted);
  font-weight: 500;
}

/* Status badges: same font, dimensions and icon alignment */
.fuel-page .badge,
.fuel-page td .badge,
.fuel-page #efficiencyStatus {
  min-width: 98px;
  min-height: 28px;
  padding: 6px 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-family: "Poppins", sans-serif !important;
  font-size: 10px !important;
  line-height: 1 !important;
  font-weight: 700 !important;
  letter-spacing: 0 !important;
  text-transform: none !important;
  white-space: nowrap;
}

.fuel-page .badge i,
.fuel-page td .badge i,
.fuel-page #efficiencyStatus i {
  width: 11px;
  font-size: 10px;
  line-height: 1;
  text-align: center;
}

.fuel-page .badge.efficient,
.fuel-page #efficiencyStatus.efficient {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #15803d;
}

.fuel-page .badge.normal,
.fuel-page #efficiencyStatus.normal {
  border-color: #bfdbfe;
  background: #eff6ff;
  color: #0b40b5;
}

.fuel-page .badge.inefficient,
.fuel-page #efficiencyStatus.inefficient {
  border-color: #fecaca;
  background: #fff1f2;
  color: #dc2626;
}

.fuel-page .badge.no-data,
.fuel-page #efficiencyStatus.no-data {
  border-color: #dbe4f0;
  background: #f8fafc;
  color: #64748b;
}

@media (max-width: 640px) {
  .fuel-page .fuel-stats-grid .stat-card {
    grid-template-columns: 42px minmax(0, 1fr);
    gap: 12px;
    padding: 15px;
  }

  .fuel-page .fuel-stats-grid .stat-icon,
  .fuel-page .fuel-chart-icon,
  .fuel-page .fuel-insight-icon {
    width: 42px;
    height: 42px;
    min-width: 42px;
    min-height: 42px;
  }
}
'''

          css_path.write_text(css.rstrip() + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/normalize-fuel-report-ui.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit normalized Fuel Reports UI
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Fuel Reports icons and status typography"
          git push origin HEAD:main
