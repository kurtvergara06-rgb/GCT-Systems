name: Apply Final Fuel Reports Redesign

on:
  push:
    paths:
      - '.github/workflows/apply-final-fuel-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Run prepared redesign patch
        shell: bash
        run: |
          git show HEAD^:.github/workflows/apply-final-fuel-redesign.yml > /tmp/prepared.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/prepared.yml').read_text(encoding='utf-8')
          start = text.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = text.index("\n          PY\n", start)
          script = text[start:end]
          # Remove the YAML indentation from the embedded Python script.
          lines = [line[10:] if line.startswith('          ') else line for line in script.splitlines()]
          Path('/tmp/apply_fuel_redesign.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_fuel_redesign.py

      - name: Commit redesigned Fuel Reports
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign Fuel Reports dashboard for readability"
          git push origin HEAD:main
