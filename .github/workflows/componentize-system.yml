          # ---------------------------------------------------------
          # REMOVE DUPLICATED DEPARTMENT SIDEBAR ARRAYS FROM PAGE SOURCES
          # ---------------------------------------------------------
          sidebar_tag = re.compile(r'<x-layout\.sidebar\b(?P<body>.*?)\/>', re.S)
          dep_re = re.compile(r'department\s*=\s*"(Maintenance|Warehouse|Purchase|Operation|Admin)"')

          sidebar_replacements = 0
          for path in Path('resources/views').rglob('*.blade.php'):
              if path == sidebar_path or 'components/' in path.as_posix():
                  continue

              text = path.read_text(encoding='utf-8')

              def replace_sidebar(match):
                  nonlocal_sidebar = None
                  body = match.group('body')
                  department_match = dep_re.search(body)
                  if not department_match:
                      return match.group(0)

                  department = department_match.group(1)
                  return f'<x-layout.sidebar department="{department}" />'

              updated, count = sidebar_tag.subn(replace_sidebar, text)
              if count and updated != text:
                  sidebar_replacements += count
                  path.write_text(updated, encoding='utf-8')

          print(f'Centralized {sidebar_replacements} page sidebar declarations.')

          # ---------------------------------------------------------
          # ADD STABLE AJAX TARGETS TO COMMON PAGE REGIONS
          # ---------------------------------------------------------
          def add_region(text, token, region):
              pattern = re.compile(
                  rf'<(?P<tag>section|div)(?![^>]*data-ajax-region)(?=[^>]*class="[^"]*\b{re.escape(token)}\b[^"]*")'
              )
              return pattern.sub(rf'<\g<tag> data-ajax-region="{region}"', text)

          region_files = 0
          for path in Path('resources/views').rglob('*.blade.php'):
              if 'components/' in path.as_posix():
                  continue

              text = path.read_text(encoding='utf-8')
              updated = add_region(text, 'stats-grid', 'summary')
              updated = add_region(updated, 'table-card', 'records')

              if updated != text:
                  region_files += 1
                  path.write_text(updated, encoding='utf-8')

          print(f'Added AJAX-ready region markers to {region_files} page files.')

          # ---------------------------------------------------------
          # UPGRADE SHARED COMPONENTS TO ACCEPT AJAX TARGET ATTRIBUTES
          # ---------------------------------------------------------
          write('resources/views/components/ui/summary-card.blade.php', r'''
          @props([
              'label' => 'Label',
              'value' => '0',
              'small' => '',
              'icon' => 'fa-chart-line',
              'color' => 'blue',
              'href' => null,
          ])

          @php
              $cardAttributes = $attributes->class([
                  'stat-card',
                  'stat-card-link' => filled($href),
              ])->merge([
                  'data-ui-component' => 'summary-card',
              ]);
          @endphp

          @if($href)
              <a href="{{ $href }}" {{ $cardAttributes }}>
          @else
              <div {{ $cardAttributes }}>
          @endif

              <div class="stat-icon {{ $color }}">
                  <i class="fa-solid {{ $icon }}"></i>
              </div>

              <div class="stat-card-content">
                  <p>{{ $label }}</p>
                  <h2>{{ $value }}</h2>

                  @if($small)
                      <small>{{ $small }}</small>
                  @endif
              </div>

          @if($href)
              </a>
          @else
              </div>
          @endif
          ''')

          write('resources/views/components/ui/table-toolbar.blade.php', r'''
          @props([
              'action',
              'class' => 'toolbar',
              'searchName' => 'search',
              'searchValue' => request('search'),
              'searchPlaceholder' => 'Search...',
              'buttonId' => null,
              'buttonLabel' => 'Add New',
              'buttonIcon' => 'fa-plus',
              'showButton' => true,
          ])

          <form
              {{ $attributes->merge([
                  'method' => 'GET',
                  'action' => $action,
                  'class' => $class,
                  'data-ui-component' => 'table-toolbar',
              ]) }}
          >
              <div class="search-box">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <input
                      type="text"
                      name="{{ $searchName }}"
                      value="{{ $searchValue }}"
                      placeholder="{{ $searchPlaceholder }}"
                  >
              </div>

              {{ $slot }}

              @if($showButton && filled($buttonLabel))
                  <button type="button" class="primary-btn" id="{{ $buttonId }}">
                      <i class="fa-solid {{ $buttonIcon }}"></i>
                      {{ $buttonLabel }}
                  </button>
              @endif
          </form>
          ''')

          write('resources/views/components/ui/table-footer.blade.php', r'''
          @props([
              'items',
          ])

          <div
              {{ $attributes->merge([
                  'class' => 'table-footer',
                  'data-ui-component' => 'table-footer',
                  'data-scroll-pagination' => true,
                  'data-page-name' => $items->getPageName(),
                  'data-next-url' => $items->nextPageUrl(),
                  'data-total' => $items->total(),
              ]) }}
          >
              <p data-entry-count>
                  Showing {{ $items->firstItem() ?? 0 }}
                  to {{ $items->lastItem() ?? 0 }}
                  of {{ $items->total() }} entries
              </p>

              <span class="table-loading-all" data-table-loading hidden>
                  <x-ui.spinner size="sm" />
                  Loading all records...
              </span>
          </div>
          ''')

          # Update status badge with semantic aliases and stable component metadata.
          status_path = Path('resources/views/components/ui/status-badge.blade.php')
          status = status_path.read_text(encoding='utf-8')
          if "'allowed' => 'active'" not in status:
              status = status.replace(
                  "        'in-stock' => 'active',",
                  "        'in-stock' => 'active',\n        'allowed' => 'active',",
              )
              status = status.replace(
                  "        'not-available' => 'inactive',",
                  "        'not-available' => 'inactive',\n        'restricted' => 'inactive',",
              )
              status = status.replace(
                  "        'unknown' => 'draft',",
                  "        'unknown' => 'draft',\n        'protected' => 'draft',\n        'review-mode' => 'draft',\n        'edit-mode-active' => 'ongoing',",
              )

          old_status_span = '<span class="{{ $badgeClass }}" {{ $attributes }}>'
          new_status_span = '''<span {{ $attributes->merge([\n    'class' => $badgeClass,\n    'data-ui-component' => 'status-badge',\n    'data-status' => $statusClass,\n]) }}>'''
          if old_status_span in status:
              status = status.replace(old_status_span, new_status_span)
          status_path.write_text(status, encoding='utf-8')

          # Add metadata to section-header while preserving arbitrary attributes.
          section_header_path = Path('resources/views/components/ui/section-header.blade.php')
          section_header = section_header_path.read_text(encoding='utf-8')
          if "'data-ui-component' => 'section-header'" not in section_header:
              section_header = section_header.replace(
                  "        'class' => trim('section-header ' . $class),",
                  "        'class' => trim('section-header ' . $class),\n        'data-ui-component' => 'section-header',",
              )
          section_header_path.write_text(section_header, encoding='utf-8')

          # Add component metadata to chart cards without changing visuals.
          chart_path = Path('resources/views/components/ui/chart-card.blade.php')
          chart = chart_path.read_text(encoding='utf-8')
          if 'data-ui-component="chart-card"' not in chart:
              chart = chart.replace(
                  '<article class="fuel-chart-card">',
                  '<article class="fuel-chart-card" data-ui-component="chart-card" data-chart-id="{{ $chartId }}">',
                  1,
              )
          chart_path.write_text(chart, encoding='utf-8')

          # ---------------------------------------------------------
          # ADD A NON-INTRUSIVE REGION UTILITY FOR FUTURE AJAX WORK
          # ---------------------------------------------------------
          write('resources/js/Main-js/ajax-regions.js', r'''
          const regionSelector = (name) => `[data-ajax-region="${CSS.escape(String(name))}"]`;

          const getRegion = (name, root = document) => root.querySelector(regionSelector(name));

          const replaceRegion = (name, html, root = document) => {
              const current = getRegion(name, root);
              if (!current) return null;

              const template = document.createElement('template');
              template.innerHTML = String(html).trim();
              const replacement = template.content.firstElementChild;

              if (!replacement) return null;

              current.replaceWith(replacement);
              document.dispatchEvent(new CustomEvent('system:region-replaced', {
                  detail: { name, element: replacement },
              }));

              return replacement;
          };

          const setRegionLoading = (name, loading = true, root = document) => {
              const region = getRegion(name, root);
              if (!region) return null;

              region.toggleAttribute('aria-busy', Boolean(loading));
              region.classList.toggle('is-region-loading', Boolean(loading));
              return region;
          };

          window.GCTRegions = Object.freeze({
              get: getRegion,
              replace: replaceRegion,
              setLoading: setRegionLoading,
          });
          ''')

          app_js_path = Path('resources/js/app.js')
          app_js = app_js_path.read_text(encoding='utf-8')
          ajax_import = "import './Main-js/ajax-regions.js';"
          if ajax_import not in app_js:
              anchor = "import './Main-js/loading-state.js';"
              app_js = app_js.replace(anchor, anchor + '\n' + ajax_import, 1)
          app_js_path.write_text(app_js, encoding='utf-8')

          # ---------------------------------------------------------
          # BASIC SOURCE AUDIT ASSERTIONS
          # ---------------------------------------------------------
          remaining_sidebar_arrays = []
          for path in Path('resources/views').rglob('*.blade.php'):
              if 'components/' in path.as_posix():
                  continue
              text = path.read_text(encoding='utf-8')
              if '<x-layout.sidebar' in text and ':items=' in text:
                  remaining_sidebar_arrays.append(path.as_posix())

          if remaining_sidebar_arrays:
              raise SystemExit(
                  'Duplicated sidebar arrays remain in page files: '
                  + ', '.join(remaining_sidebar_arrays)
              )

          print('Componentization source audit passed.')
          PY

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel test environment
        shell: bash
        run: |
          cp .env.example .env
          touch database/database.sqlite
          cat >> .env <<EOF
          APP_ENV=testing
          DB_CONNECTION=sqlite
          DB_DATABASE=${{ github.workspace }}/database/database.sqlite
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          EOF
          php artisan key:generate --force

      - name: Validate Laravel migrations
        run: php artisan migrate --force

      - name: Compile all Blade views
        run: |
          php artisan optimize:clear
          php artisan view:cache

      - name: Validate routes
        run: php artisan route:list > /tmp/gct-routes.txt

      - name: Build frontend assets
        run: npm run build

      - name: Run automated tests
        run: php artisan test

      - name: Commit component refactor after successful tests
        shell: bash
        run: |
          rm -f .github/workflows/componentize-system.yml

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Componentize shared system UI for AJAX-ready updates"
          git push origin HEAD:main
