name: Regenerate Delay Sample Model

on:
  push:
    branches:
      - improve/delay-model-r2
    paths:
      - '.github/workflows/regenerate-delay-sample.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: improve/delay-model-r2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install delay-model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "pandas>=2.2,<4" "scikit-learn>=1.5,<2" "joblib>=1.4,<2"

      - name: Regenerate sample dataset and model
        working-directory: python_engine
        run: |
          python -m delay.prepare_training_data
          python -m delay.train_model
          python -m delay.test_delay_signal

      - name: Verify regenerated R2
        working-directory: python_engine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('delay/models/delay_arrival_state.json').read_text())
          r2 = float(state['metrics']['r2'])
          print(f'Regenerated Delay Model #3 R2={r2:.4f}')
          if r2 < 0.45:
              raise SystemExit(f'R2 regression: {r2:.4f}')
          PY

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            training_data/delay/sample_delay_training.csv \
            training_data/delay/sample_delay_training_features.csv \
            python_engine/delay/models/delay_arrival_rf.pkl \
            python_engine/delay/models/delay_arrival_features.json \
            python_engine/delay/models/delay_arrival_report.txt \
            python_engine/delay/models/delay_arrival_state.json
          if git diff --cached --quiet; then
            echo "No regenerated artifact changes to commit."
          else
            git commit -m "Regenerate Delay Model #3 sample artifacts"
            git push origin HEAD:improve/delay-model-r2
          fi
