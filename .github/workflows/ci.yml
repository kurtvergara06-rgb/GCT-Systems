name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'improve/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gct_system_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: gct_system_test
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          php artisan key:generate

      - name: Run Laravel test suite
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

  python:
    name: Python validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python engine
        run: python -m compileall -q python_engine

      - name: Install Python model test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "numpy>=2,<3" "pandas>=2.2,<4" "scikit-learn>=1.5,<2" "joblib>=1.4,<2" "pymysql>=1.1,<2"

      - name: Verify production genuine-data ML policy
        working-directory: python_engine
        run: python test_ml_production_policy.py

      - name: Verify production model status contracts
        working-directory: python_engine
        run: python test_model_status_contracts.py

      - name: Verify required NLP modules
        working-directory: python_engine
        run: python -m NLP.test_required_modules

      - name: Verify Delay Model #3 signal quality
        working-directory: python_engine
        run: python -m delay.test_delay_signal

      - name: Verify Fuel Model #2 API
        working-directory: python_engine
        run: python -m fuel.test_api_smoke
