name: Implement Daily Fuel Monitoring

on:
  push:
    paths:
      - '.github/workflows/implement-daily-fuel-monitoring.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update existing Fuel Reports files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # Controller
          # ------------------------------------------------------------
          path = Path('app/Http/Controllers/Maintenance/FuelReportController.php')
          text = path.read_text(encoding='utf-8')

          old = """        $buses = Bus::query()\n            ->orderBy('bus_no')\n            ->get();\n\n        return view('Maintenance.fuel-reports', compact(\n"""
          new = """        $buses = Bus::query()\n            ->orderBy('bus_no')\n            ->get();\n\n        $monitorDate = $request->input(\n            'monitor_date',\n            today()->toDateString()\n        );\n\n        $monitorFilter = $request->input(\n            'monitor_filter',\n            'all'\n        );\n\n        $dailyGpsGroups = GpsTripRecord::query()\n            ->whereDate('beginning_at', $monitorDate)\n            ->whereNotNull('mileage_km')\n            ->where('mileage_km', '>', 0)\n            ->whereHas('batchUpload', function ($query) {\n                $query->where('status', 'Processed');\n            })\n            ->orderBy('beginning_at')\n            ->get()\n            ->groupBy(fn ($record) => strtoupper(trim($record->bus_no)));\n\n        $dailyFuelGroups = FuelReport::query()\n            ->whereDate('report_date', $monitorDate)\n            ->orderByDesc('id')\n            ->get()\n            ->groupBy(fn ($record) => strtoupper(trim($record->bus_no)));\n\n        $busLookup = $buses->keyBy(\n            fn ($bus) => strtoupper(trim($bus->bus_no))\n        );\n\n        $monitorBusKeys = $dailyGpsGroups->keys()\n            ->merge($dailyFuelGroups->keys())\n            ->unique()\n            ->sort()\n            ->values();\n\n        $dailyMonitoring = $monitorBusKeys\n            ->map(function ($busKey) use (\n                $dailyGpsGroups,\n                $dailyFuelGroups,\n                $busLookup\n            ) {\n                $gpsRecords = $dailyGpsGroups->get(\n                    $busKey,\n                    collect()\n                );\n\n                $fuelRecord = $dailyFuelGroups\n                    ->get($busKey, collect())\n                    ->first();\n\n                $distanceKm = (float) $gpsRecords\n                    ->sum('mileage_km');\n\n                $idlingMinutes = (int) $gpsRecords\n                    ->sum('idling_minutes');\n\n                $bus = $busLookup->get($busKey);\n\n                $workflowStatus = match (true) {\n                    $fuelRecord && $distanceKm > 0 => 'Completed',\n                    $fuelRecord && $distanceKm <= 0 => 'Missing GPS',\n                    $distanceKm > 0 => 'For Fuel Entry',\n                    default => 'Monitoring',\n                };\n\n                return (object) [\n                    'bus_no' => $bus?->bus_no\n                        ?? $fuelRecord?->bus_no\n                        ?? $gpsRecords->first()?->bus_no\n                        ?? $busKey,\n                    'bus_model' => $bus?->bus_model,\n                    'gps_distance_km' => $distanceKm,\n                    'idling_minutes' => $idlingMinutes,\n                    'fuel_liters' => (float) ($fuelRecord?->fuel_liters ?? 0),\n                    'driver_name' => $fuelRecord?->driver_name,\n                    'workflow_status' => $workflowStatus,\n                    'efficiency_status' => $fuelRecord?->status ?? 'No Data',\n                    'km_per_liter' => (float) ($fuelRecord?->km_per_liter ?? 0),\n                    'fuel_report_id' => $fuelRecord?->id,\n                ];\n            });\n\n        if ($monitorFilter === 'needs-entry') {\n            $dailyMonitoring = $dailyMonitoring\n                ->where('workflow_status', 'For Fuel Entry')\n                ->values();\n        } elseif ($monitorFilter === 'needs-review') {\n            $dailyMonitoring = $dailyMonitoring\n                ->filter(fn ($row) => in_array(\n                    $row->workflow_status,\n                    ['Missing GPS', 'Monitoring'],\n                    true\n                ))\n                ->values();\n        }\n\n        $dailyMonitoringCounts = [\n            'total' => $monitorBusKeys->count(),\n            'for_entry' => $monitorBusKeys->filter(\n                fn ($busKey) =>\n                    $dailyGpsGroups->get($busKey, collect())->isNotEmpty()\n                    && $dailyFuelGroups->get($busKey, collect())->isEmpty()\n            )->count(),\n            'completed' => $monitorBusKeys->filter(\n                fn ($busKey) =>\n                    $dailyGpsGroups->get($busKey, collect())->isNotEmpty()\n                    && $dailyFuelGroups->get($busKey, collect())->isNotEmpty()\n            )->count(),\n        ];\n\n        return view('Maintenance.fuel-reports', compact(\n"""
          if old not in text:
              raise SystemExit('Controller index anchor not found')
          text = text.replace(old, new, 1)

          old = """            'leastEfficientVehicle'\n        ));\n    }\n\n    public function gpsDistance(Request $request): JsonResponse\n"""
          new = """            'leastEfficientVehicle',\n            'dailyMonitoring',\n            'dailyMonitoringCounts',\n            'monitorDate',\n            'monitorFilter'\n        ));\n    }\n\n    public function saveDailyMonitoring(Request $request): RedirectResponse\n    {\n        $validated = $request->validate([\n            'monitor_date' => ['required', 'date'],\n            'entries' => ['nullable', 'array'],\n            'entries.*.bus_no' => [\n                'required',\n                'string',\n                'exists:buses,bus_no',\n            ],\n            'entries.*.fuel_liters' => [\n                'nullable',\n                'numeric',\n                'min:0.01',\n            ],\n            'entries.*.driver_name' => [\n                'nullable',\n                'string',\n                'max:255',\n            ],\n        ]);\n\n        $saved = 0;\n        $skipped = 0;\n\n        foreach ($validated['entries'] ?? [] as $entry) {\n            if (\n                !isset($entry['fuel_liters'])\n                || $entry['fuel_liters'] === ''\n                || (float) $entry['fuel_liters'] <= 0\n            ) {\n                continue;\n            }\n\n            $gpsRecords = GpsTripRecord::query()\n                ->whereRaw(\n                    'UPPER(TRIM(bus_no)) = ?',\n                    [strtoupper(trim($entry['bus_no']))]\n                )\n                ->whereDate(\n                    'beginning_at',\n                    $validated['monitor_date']\n                )\n                ->whereNotNull('mileage_km')\n                ->where('mileage_km', '>', 0)\n                ->whereHas('batchUpload', function ($query) {\n                    $query->where('status', 'Processed');\n                })\n                ->orderBy('beginning_at')\n                ->get();\n\n            if ($gpsRecords->isEmpty()) {\n                $skipped++;\n                continue;\n            }\n\n            $distanceKm = (float) $gpsRecords\n                ->sum('mileage_km');\n\n            $fuelLiters = (float) $entry['fuel_liters'];\n            $kmPerLiter = $fuelLiters > 0\n                ? $distanceKm / $fuelLiters\n                : 0;\n\n            $fuelReport = FuelReport::query()\n                ->whereDate(\n                    'report_date',\n                    $validated['monitor_date']\n                )\n                ->whereRaw(\n                    'UPPER(TRIM(bus_no)) = ?',\n                    [strtoupper(trim($entry['bus_no']))]\n                )\n                ->orderByDesc('id')\n                ->first();\n\n            $payload = [\n                'report_date' => $validated['monitor_date'],\n                'bus_no' => $entry['bus_no'],\n                'driver_name' => $entry['driver_name'] ?? null,\n                'gps_trip_record_id' => $gpsRecords->last()?->id,\n                'distance_km' => round($distanceKm, 2),\n                'distance_source' => 'GPS',\n                'fuel_liters' => round($fuelLiters, 2),\n                'km_per_liter' => round($kmPerLiter, 2),\n                'status' => $this->getFuelStatus($kmPerLiter),\n                'remarks' => 'Saved from Daily Fuel Monitoring.',\n                'manual_distance_reason' => null,\n            ];\n\n            if ($fuelReport) {\n                $fuelReport->update($payload);\n            } else {\n                FuelReport::create($payload);\n            }\n\n            $saved++;\n        }\n\n        $message = $saved > 0\n            ? \"{$saved} daily fuel record(s) saved successfully.\"\n            : 'No fuel entries were changed.';\n\n        if ($skipped > 0) {\n            $message .= \" {$skipped} row(s) were skipped because GPS data was missing.\";\n        }\n\n        return redirect()\n            ->to(route('fuel-reports', [\n                'monitor_date' => $validated['monitor_date'],\n            ], false))\n            ->with('success', $message);\n    }\n\n    public function gpsDistance(Request $request): JsonResponse\n"""
          if old not in text:
              raise SystemExit('Controller method anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # Routes
          # ------------------------------------------------------------
          path = Path('routes/web.php')
          text = path.read_text(encoding='utf-8')
          old = """            Route::post(\n                '/',\n                'store'\n            )->name(\n                'fuel-reports.store'\n            );\n\n\n            Route::put(\n"""
          new = """            Route::post(\n                '/',\n                'store'\n            )->name(\n                'fuel-reports.store'\n            );\n\n\n            Route::post(\n                '/daily-monitoring',\n                'saveDailyMonitoring'\n            )->name(\n                'fuel-reports.daily-monitoring'\n            );\n\n\n            Route::put(\n"""
          if old not in text:
              raise SystemExit('Routes anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # Blade: insert Daily Fuel Monitoring before efficiency table
          # ------------------------------------------------------------
          path = Path('resources/views/Maintenance/fuel-reports.blade.php')
          text = path.read_text(encoding='utf-8')
          anchor = """      {{-- EFFICIENCY TABLE --}}\n"""
          section = r'''      {{-- DAILY FUEL MONITORING --}}
      <section class="table-card fuel-card daily-fuel-monitoring-card">

        <div class="section-header daily-monitoring-header">
          <div>
            <h2>Daily Fuel Monitoring</h2>
            <p>GPS activity is loaded automatically. Enter fuel only for buses that actually refueled.</p>
          </div>

          <div class="daily-monitoring-summary">
            <span><strong>{{ $dailyMonitoringCounts['total'] }}</strong> Active</span>
            <span class="needs-entry"><strong>{{ $dailyMonitoringCounts['for_entry'] }}</strong> For Entry</span>
            <span class="completed"><strong>{{ $dailyMonitoringCounts['completed'] }}</strong> Completed</span>
          </div>
        </div>

        <form method="GET" action="{{ route('fuel-reports') }}" class="daily-monitoring-filters">
          <div class="daily-filter-field">
            <label for="monitorDate">Monitoring Date</label>
            <input
              type="date"
              id="monitorDate"
              name="monitor_date"
              value="{{ $monitorDate }}"
              onchange="this.form.submit()"
            >
          </div>

          <div class="daily-filter-field">
            <label for="monitorFilter">Show</label>
            <select
              id="monitorFilter"
              name="monitor_filter"
              onchange="this.form.submit()"
            >
              <option value="all" @selected($monitorFilter === 'all')>All Active Buses</option>
              <option value="needs-entry" @selected($monitorFilter === 'needs-entry')>Needs Fuel Entry</option>
              <option value="needs-review" @selected($monitorFilter === 'needs-review')>Needs Review</option>
            </select>
          </div>
        </form>

        <form
          method="POST"
          action="{{ route('fuel-reports.daily-monitoring') }}"
          class="daily-monitoring-form"
        >
          @csrf
          <input type="hidden" name="monitor_date" value="{{ $monitorDate }}">

          <div class="table-wrap daily-monitoring-table-wrap">
            <table class="fuel-table daily-monitoring-table">
              <thead>
                <tr>
                  <th>Bus ID</th>
                  <th>GPS Distance</th>
                  <th>Idling</th>
                  <th>Fuel Entry</th>
                  <th>Driver</th>
                  <th>Workflow</th>
                  <th>Efficiency</th>
                </tr>
              </thead>

              <tbody>
                @forelse($dailyMonitoring as $index => $row)
                  @php
                    $workflowClass = strtolower(str_replace(' ', '-', $row->workflow_status));
                    $efficiencyClass = strtolower(str_replace(' ', '-', $row->efficiency_status));
                  @endphp

                  <tr class="daily-monitoring-row {{ $workflowClass }}">
                    <td>
                      <strong>{{ $row->bus_no }}</strong>
                      @if($row->bus_model)
                        <small>{{ $row->bus_model }}</small>
                      @endif
                      <input type="hidden" name="entries[{{ $index }}][bus_no]" value="{{ $row->bus_no }}">
                    </td>

                    <td>
                      <strong>{{ number_format($row->gps_distance_km, 2) }} km</strong>
                      <small>Processed GPS</small>
                    </td>

                    <td>
                      {{ number_format($row->idling_minutes) }} min
                    </td>

                    <td>
                      <div class="inline-fuel-input">
                        <input
                          type="number"
                          step="0.01"
                          min="0.01"
                          name="entries[{{ $index }}][fuel_liters]"
                          value="{{ $row->fuel_liters > 0 ? number_format($row->fuel_liters, 2, '.', '') : '' }}"
                          placeholder="Enter liters"
                          @disabled($row->gps_distance_km <= 0)
                        >
                        <span>L</span>
                      </div>
                    </td>

                    <td>
                      <input
                        class="inline-driver-input"
                        type="text"
                        name="entries[{{ $index }}][driver_name]"
                        value="{{ $row->driver_name }}"
                        placeholder="Optional"
                        maxlength="255"
                        @disabled($row->gps_distance_km <= 0)
                      >
                    </td>

                    <td>
                      <span class="workflow-badge {{ $workflowClass }}">
                        @if($row->workflow_status === 'Completed')
                          <i class="fa-solid fa-circle-check"></i>
                        @elseif($row->workflow_status === 'For Fuel Entry')
                          <i class="fa-solid fa-gas-pump"></i>
                        @elseif($row->workflow_status === 'Missing GPS')
                          <i class="fa-solid fa-triangle-exclamation"></i>
                        @else
                          <i class="fa-solid fa-clock"></i>
                        @endif
                        {{ $row->workflow_status }}
                      </span>
                    </td>

                    <td>
                      <span class="badge {{ $efficiencyClass }}">
                        @if($row->efficiency_status === 'Efficient')
                          <i class="fa-solid fa-circle-check"></i>
                        @elseif($row->efficiency_status === 'Normal')
                          <i class="fa-solid fa-gauge-high"></i>
                        @elseif($row->efficiency_status === 'Inefficient')
                          <i class="fa-solid fa-triangle-exclamation"></i>
                        @else
                          <i class="fa-solid fa-minus"></i>
                        @endif
                        {{ $row->efficiency_status }}
                      </span>

                      @if($row->km_per_liter > 0)
                        <small class="daily-efficiency-value">{{ number_format($row->km_per_liter, 2) }} km/L</small>
                      @endif
                    </td>
                  </tr>
                @empty
                  <x-ui.empty-row
                    colspan="7"
                    message="No processed GPS activity was found for this monitoring date."
                  />
                @endforelse
              </tbody>
            </table>
          </div>

          @if($dailyMonitoring->isNotEmpty())
            <div class="daily-monitoring-actions">
              <p>
                <i class="fa-solid fa-circle-info"></i>
                Blank fuel fields are ignored. Existing values can be corrected and saved again.
              </p>

              <button type="submit" class="daily-save-btn">
                <i class="fa-solid fa-floppy-disk"></i>
                Save All Changes
              </button>
            </div>
          @endif
        </form>
      </section>

'''
          if anchor not in text:
              raise SystemExit('Blade anchor not found')
          if 'Daily Fuel Monitoring' not in text:
              text = text.replace(anchor, section + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # CSS: append directly to existing fuel-reports.css
          # ------------------------------------------------------------
          path = Path('resources/css/Maintenance/fuel-reports.css')
          text = path.read_text(encoding='utf-8')
          marker = 'DAILY FUEL MONITORING'
          if marker not in text:
              text += r'''

